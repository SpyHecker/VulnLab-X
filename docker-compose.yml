services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: vulnmart:latest
    container_name: vulnmart
    ports:
      - "8080:80"
    volumes:
      # Live code editing plus a persistent database across container restarts.
      - ./src:/var/www/html
      - ./data:/var/www/data
    environment:
      DB_PATH: /var/www/data/vulnmart.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
