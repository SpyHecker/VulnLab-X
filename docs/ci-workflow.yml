# GitHub Actions pipeline for VulnMart.
#
# This file is a template on purpose: the automation that prepared this branch
# is not allowed to create workflow files, so copy it into place once and commit
# the result yourself:
#
#   mkdir -p .github/workflows
#   cp docs/ci-workflow.yml .github/workflows/ci.yml
#   git add .github/workflows/ci.yml && git commit -m "ci: run lint and the smoke suite"
#
# After that the badge in Readme.md becomes live.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    name: PHP lint and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, libxml, dom, simplexml
          coverage: none

      - name: Check the bash scripts
        run: bash -n tools/smoke_test.sh

      - name: Lint every PHP file
        run: make lint

      - name: Run the smoke test
        run: make test
